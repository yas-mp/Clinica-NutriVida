  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <header>
      <nav class="navbar navbar-expand-lg navCustom" data-bs-theme="dark">
        <div class="container-fluid">
          <a class="navbar-brand" href="../index.html">NutriVida</a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNavAltMarkup"
            aria-controls="navbarNavAltMarkup"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>

          <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
            <ul class="navbar-nav mx-auto">
              <li class="nav-item">
                <a
                  class="nav-link active"
                  aria-current="page"
                  href="nosotros.html"
                  >Nosotros</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link active" href="profesionales.html"
                  >Profesionales</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link active" href="#">Reserva hora</a>
              </li>
              <li class="nav-item">
                <a class="nav-link active" href="contactanos.html"
                  >Contactános</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link active" href="#">Servicios</a>
              </li>
              <li class="nav-item">
                <a class="nav-link active" href="blog.html">Blog</a>

            </ul>
              <a class="btn btn-success btn-sm ms-2" href="inicio-sesion.html" style="border-radius: 15px;">Mi portal</a>
          </div>
        </div>
      </nav>
    </header>
    <main>
      <div class="container my-4" style="max-width: 800px">
        <div class="section-registro p-4 shadow-sm bg-white rounded">
          <form class="row g-3" id="formulario-registro">
            <h2 class="titulo-registro">Registro de Usuario</h2>
            <div class="col-md-6">
              <label for="nombres" class="form-label">Nombres</label>
              <input
                type="text"
                class="form-control"
                id="nombres"
                maxlength="50"
                required
              />
            </div>
            <div class="col-md-6">
              <label for="apellidos" class="form-label">Apellidos</label>
              <input
                type="text"
                class="form-control"
                id="apellidos"
                maxlength="100"
                required
              />
            </div>

            <div class="col-md-4">
              <label for="rut" class="form-label"
                >RUT (sin puntos ni guión)</label
              >
              <input
                type="text"
                class="form-control"
                id="rut"
                placeholder="188663338"
                maxlength="9"
                required
              />
            </div>
            <div class="col-md-8">
              <label for="correo" class="form-label">Correo electrónico</label>
              <input
                type="email"
                class="form-control"
                id="correo"
                placeholder="ejemplo@gmail.com"
                maxlength="100"
                required
              />
            </div>

            <div class="col-md-6">
              <label for="clave" class="form-label">Contraseña</label>
              <input
                type="password"
                class="form-control"
                id="clave"
                minlength="4"
                maxlength="10"
                required
              />
            </div>
            <div class="col-md-6">
              <label for="fecha-nacimiento" class="form-label"
                >Fecha de nacimiento</label
              >
              <input
                type="date"
                class="form-control"
                id="fecha-nacimiento"
                required
              />
            </div>

            <div class="col-md-6">
              <label for="region" class="form-label">Región</label>
              <select id="region" class="form-select" required>
                <option value="" selected disabled>Selecciona región...</option>
              </select>
            </div>
            <div class="col-md-6">
              <label for="comuna" class="form-label">Comuna</label>
              <select id="comuna" class="form-select" required>
                <option value="" selected disabled>Selecciona comuna...</option>
              </select>
            </div>

            <div class="col-md-8">
              <label for="direccion" class="form-label">Dirección</label>
              <input
                type="text"
                class="form-control"
                id="direccion"
                maxlength="100"
                required
              />
            </div>
      
            <div class="col-12 mt-4">
              <button type="submit" class="btn w-100" style="background-color: green; color:aliceblue; box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);">
                Registrarse
              </button>
            </div>
          </form>
        </div>
      </div>
    </main>
    <footer>
      <p class="p">Clinica nutricional - NutriVida</p>
    </footer>

    <script src="../js/registro-usuario.js"></script>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"

      crossorigin="anonymous"
    ></script>
  </body>
</html>
