<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clinica Nutricional - Vista Detallada</title>
    <link rel="stylesheet" href="../style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body class="detalle-servicio d-flex flex-column min-vh-100">
    <header>
      <nav
        class="navbar navbar-expand-lg navCustom navbar-dark bg-success shadow-sm"
      >
        <div class="container-fluid">
          <a class="navbar-brand fw-bold" href="../index.html">NutriVida</a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNavAltMarkup"
            aria-controls="navbarNavAltMarkup"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>

          <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
            <ul class="navbar-nav mx-auto">
              <li class="nav-item">
                <a class="nav-link" href="nosotros.html">Nosotros</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="profesionales.html">Profesionales</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="reservas-horas.html">Reserva hora</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="contactanos.html">Contáctanos</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="servicios.html">Servicios</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="blog.html">Blog</a>
              </li>
            </ul>
            <div class="d-flex align-items-center">
              <a
                class="btn btn-light text-success fw-bold btn-sm"
                href="inicio-sesion.html"
                style="border-radius: 15px"
                >Mi portal</a
              >
            </div>
          </div>
        </div>
      </nav>
    </header>

    <main class="container my-auto py-5 d-flex justify-content-center">
      <div
        class="card shadow-lg border-0 overflow-hidden"
        style="
          max-width: 650px;
          width: 100%;
          border-radius: 16px;
          background-color: rgba(255, 255, 255, 0.95);
        "
      >
        <div class="text-center bg-success text-white py-3">
          <h1 class="m-0 fs-4 fw-bold">Vista Detallada del Servicio</h1>
        </div>

        <div class="text-center p-3 bg-light">
          <img
            id="imagen"
            class="img-fluid rounded shadow-sm"
            style="max-height: 250px; object-fit: cover"
          />
        </div>

        <div class="card-body p-4">
          <h2
            id="nombre"
            class="card-title text-success fw-bold text-center mb-3 fs-3"
          ></h2>

          <p id="descripcion" class="text-muted text-center mb-4 lead fs-6"></p>

          <hr class="my-4" />

          <div class="row g-3 text-secondary text-center">
            <div class="col-6 col-md-4">
              <span class="d-block fw-bold text-dark">Código:</span>
              <span id="codigo"></span>
            </div>
            <div class="col-6 col-md-4">
              <span class="d-block fw-bold text-dark">Tipo:</span>
              <span id="tipo"></span>
            </div>
            <div class="col-6 col-md-4">
              <span class="d-block fw-bold text-dark">Duración:</span>
              <span id="duracion"></span>
            </div>
            <div class="col-6 col-md-4">
              <span class="d-block fw-bold text-dark">Modalidad:</span>
              <span id="modalidad"></span>
            </div>
            <div class="col-6 col-md-8">
              <span class="d-block fw-bold text-dark">Profesional:</span>
              <span id="profesional"></span>
            </div>
          </div>

          <div
            class="d-flex justify-content-between align-items-center mt-4 pt-3 border-top"
          >
            <span id="precio" class="fs-4 fw-bold text-success"></span>
            <a href="servicios.html" class="btn btn-outline-success fw-bold"
              >Volver a Servicios</a
            >
          </div>
        </div>
      </div>
    </main>

    <footer class="bg-dark text-white text-center py-3 mt-auto">
      <p class="m-0">Clínica Nutricional - NutriVida &copy; 2026</p>
    </footer>

    <script src="../js/detalle-servicios.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
