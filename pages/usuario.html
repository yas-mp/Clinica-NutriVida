<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clinica NutriVida - Mi portal</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="../style.css" />
  </head>
  <header>
    <nav class="navbar navbar-expand-lg navCustom" data-bs-theme="dark">
      <div class="container-fluid">
        <a class="navbar-brand" href="../index.html">NutriVida</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNavAltMarkup"
          aria-controls="navbarNavAltMarkup"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
          <ul class="navbar-nav mx-auto"></ul>
          <div class="d-flex align-items-center">
            <button
              type="button"
              class="btn btn-success btn-sm"
              onclick="cerrarSesion()"
              style="
                border-radius: 15px;
                background-color: rgb(114, 21, 21);
                border: none;
              "
            >
              Cerrar sesión
            </button>
          </div>
        </div>
      </div>
    </nav>
  </header>
  <body>
    <main>
      <section class="section-usuario">
        <div>
          <div class="p-4">
            <h2
              class="text-center fw-bold mb-4"
              style="
                color: #2a492a;
                border-bottom: 3px solid #2a492a;
                padding-bottom: 10px;
              "
              id="titulo-bienvenida"
            >
              Bienvenido a tu Portal
            </h2>
            <div
              class="mb-4 p-3 rounded"
              style="background-color: #f8f9fa; border-left: 5px solid #2a492a"
            >
              <h4 class="fw-bold mb-3" style="color: #2a492a">
                Mis Datos Personales
              </h4>
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label fw-bold">Nombre Completo:</label>
                  <input
                    type="text"
                    class="form-control"
                    id="perfil-nombre"
                    readonly
                  />
                </div>
                <div class="col-md-6">
                  <label class="form-label fw-bold">RUN:</label>
                  <input
                    type="text"
                    class="form-control"
                    id="perfil-run"
                    readonly
                  />
                </div>
                <div class="col-md-6">
                  <label class="form-label fw-bold">Correo Electrónico:</label>
                  <input
                    type="text"
                    class="form-control"
                    id="perfil-correo"
                    readonly
                  />
                </div>
                <div class="col-md-6">
                  <label class="form-label fw-bold">Comuna / Región:</label>
                  <input
                    type="text"
                    class="form-control"
                    id="perfil-ubicacion"
                    readonly
                  />
                </div>
              </div>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-3">
              <h4 class="m-0 fw-bold" style="color: #2a492a">
                Mis Citas Medicas
              </h4>
              <a
                href="servicios.html"
                class="btn btn-sm text-white"
                style="background-color: #2a492a"
              >
                + Reservar Cita
              </a>
            </div>

            <div class="table-responsive">
              <table class="table table-hover align-middle" id="tabla-citas">
                <thead class="text-white" style="background-color: #2a492a">
                  <tr>
                    <th>Servicio</th>
                    <th>Fecha</th>
                    <th>Hora</th>
                    <th>Estado</th>
                    <th class="text-center">Acción</th>
                  </tr>
                </thead>
                <tbody>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </section>
    </main>
    <script src="../js/vista-usuario.js"></script>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
