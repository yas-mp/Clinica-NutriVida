<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clinica Nutricional - Contactános</title>
    <link rel="stylesheet" href="../style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <header>
      <nav class="navbar navbar-expand-lg navCustom" data-bs-theme="dark">
        <div class="container-fluid">
          <a class="navbar-brand" href="../index.html">NutriVida</a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNavAltMarkup"
            aria-controls="navbarNavAltMarkup"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>

          <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
            <ul class="navbar-nav mx-auto">
              <li class="nav-item">
                <a
                  class="nav-link active"
                  aria-current="page"
                  href="nosotros.html"
                  >Nosotros</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link active" href="profesionales.html"
                  >Profesionales</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link active" href="#">Reserva hora</a>
              </li>
              <li class="nav-item">
                <a class="nav-link active" href="contactanos.html"
                  >Contactános</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link active" href="#">Servicios</a>
              </li>
              <li class="nav-item">
                <a class="nav-link active" href="blog.html">Blog</a>
              </li>
            </ul>
            <li class="InicioSesion">
              <a class="nav-link active" href="#">Iniciar sesion</a>
            </li>
          </div>
        </div>
      </nav>
    </header>
    <main>
      
      <div class="card mx-auto" style="max-width: 450px">
        <div class="card-body">
          <form class="row g-3">
            <div class="col-12">
              <label for="inputNombres" class="form-label"
                >Nombre completo</label
              >
              <input type="email" class="form-control" id="inputNombres"
              placeholder="Pedro Juan Peréz Gonzalés" />
            </div>

            <div class="col-12">
              <label for="inputEmail4" class="form-label"
                >Correo electrónico</label>
              <input
                type="email"
                class="form-control"
                id="inputEmail4"
                placeholder="example@gmail.com"
              />
            </div>

            <div class="col-12">
              <label for="floatingTextarea2" class="form-label">Comentarios</label>
              <textarea
                class="form-control"
                placeholder="Máximo 100 carácteres..."
                id="floatingTextarea2"
                style="height: 100px"
              ></textarea>
            </div>

            <div class="col-12">
              <button type="submit" class="btn btn-success d-block mx-auto " style="background-color: rgb(49, 78, 34);">Enviar</button>
            </div>
          </form>
        </div>
      </div>
    </main>
    <footer>
      <p class="p">Clinica nutricional - NutriVida</p>
    </footer>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
