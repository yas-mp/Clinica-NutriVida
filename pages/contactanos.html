    </header>
    <main>
      <div class="card mx-auto" style="max-width: 450px; margin-top: 20px">
        <div class="card-body">
          <form class="row g-3" onsubmit="formulario(event)" novalidate>
            <div class="col-12">
              <label for="nombre" class="form-label">Nombre completo</label>
              <input
                type="text"
                class="form-control"
                id="nombre"
                placeholder="Pedro Juan Peréz Gonzalés"
                maxlength="100"
              />
            </div>

            <div class="col-12">
              <label for="correo" class="form-label">Correo electrónico</label>
              <input
                type="email"
                class="form-control"
                id="correo"
                placeholder="example@gmail.com"
                maxlength="100"
              />
            </div>

            <div class="col-12">
              <label for="comentarios" class="form-label">Comentarios</label>
              <textarea
                class="form-control"
                placeholder="Máximo 500 carácteres..."
                id="comentarios"
                style="height: 100px"
                maxlength="500"
              ></textarea>
            </div>

            <div class="col-12">
              <button
                type="submit" onclick="formulario(event)"
                class="btn btn-success d-block mx-auto"
                style="background-color: rgb(49, 78, 34)"
              >
                Enviar
              </button>
            </div>
          </form>
        </div>
      </div>
    </main>
    <footer>
