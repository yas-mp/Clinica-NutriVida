<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clinica Nutricional - Iniciar Sesión</title>
    <link rel="stylesheet" href="../style.css">
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
</head>
<body class="inicioSesion">
    
    <div class="login">

        <h1>Iniciar sesión</h1>

      <div class="mb-3">
        <label for="correo" class="form-label fw-bold">Correo:</label>
        <input
          type="email"
          id="correo"
          class="form-control"
          placeholder="ejemplo@correo.com"
        />
      </div>

      <div class="mb-4">
        <label for="clave" class="form-label fw-bold">Contraseña:</label>
        <input
          type="password"
          id="clave"
          maxlength="4"
          class="form-control"
          placeholder="****"
        />
      </div>

      <button
        type="button"
        class="btn btn-success w-100 fw-bold mb-3"
        onclick="ingresar()"
      >
        Ingresar
      </button>

      <div class="text-center mt-3">
        <span class="text-muted" style="margin-top: 10px; text-align: center;">¿No tienes una cuenta?</span><br />
        <a
          href="registro-usuario.html"
          class="fw-bold text-decoration-none"
          style="color: #2a492a"
        >
          Regístrate aquí
        </a>
      </div>
    </div>

    <script src="../js/inicio-sesion.js"></script>

</body>
</html>
