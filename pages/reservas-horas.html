      crossorigin="anonymous"
    />

  <body>
    <header>
      <nav class="navbar navbar-expand-lg navCustom" data-bs-theme="dark">
        <div class="container-fluid">
          <a class="navbar-brand text-white fw-bold" href="../index.html"
            >NutriVida</a

            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNavAltMarkup"
            aria-controls="navbarNavAltMarkup"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>

          <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
            <ul class="navbar-nav mx-auto">
              <li class="nav-item">
                <a
                  class="nav-link active text-white"
                  aria-current="page"

                  Nosotros

              </li>
              <li class="nav-item">
                <a class="nav-link active text-white" href="profesionales.html">

          </div>
        </div>
      </nav>
    </header>

    <main class="container my-4">
        <form
          id="formulario-reserva"
          class="card p-4 shadow-sm mx-auto"
          style="max-width: 600px"
        >
          <h3
            class="mb-3 text-center pb-2"
            style="border-bottom: 3px solid #2a492a"
          >
            Agendar Hora
          </h3>

          <div class="mb-3">
            <label class="form-label fw-bold">RUT del Paciente</label>
            <input
              type="text"
              id="reserva-rut"
              class="form-control"
              placeholder="12345678K"
              required
            />
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold">Servicio</label>
            <select id="reserva-servicio" class="form-select" required>
              <option value="">Seleccione un Servicio...</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold">Profesional</label>
            <select id="reserva-profesional" class="form-select" required>
              <option value="">Seleccione un Profesional...</option>
            </select>
          </div>

          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label fw-bold">Fecha</label>
              <input
                type="date"
                id="reserva-fecha"
                class="form-control"
                required
              />
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label fw-bold">Hora</label>
              <select id="reserva-hora" class="form-select" required>
                <option value="">Seleccione una hora...</option>
                <option value="09:00">09:00 hrs</option>
                <option value="10:00">10:00 hrs</option>
                <option value="11:00">11:00 hrs</option>
                <option value="15:00">15:00 hrs</option>
                <option value="16:00">16:00 hrs</option>
              </select>
            </div>
          </div>
          <button
            type="submit"
            class="btn btn-success w-100 fw-bold mt-2"
            style="
              background-color: rgb(49, 78, 34);
              border-color: rgb(49, 78, 34);
            "
          >
            Confirmar Reserva
          </button>
        </form>
    </main>

    <footer>
      <p class="m-0 text-center">Clínica Nutricional - NutriVida &copy; 2026</p>
    </footer>

    <script

    <script src="../js/reservas-horas.js"></script>
