    <main>
      <form id="formulario-reserva" class="card p-4 shadow-sm">
        <h3 class="mb-3">Agendar Hora</h3>

        <div class="mb-3">
          <label class="form-label">RUT del Paciente</label>
          <input
            type="text"
            id="reserva-rut"
            class="form-control"
            placeholder="12345678K"
            required
          />
        </div>

        <div class="mb-3">
          <label class="form-label">Servicio</label>
          <select id="reserva-servicio" class="form-select" required>
            <option value="">Seleccione un Servicio...</option>
          </select>
        </div>

        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">Fecha</label>
            <input
              type="date"
              id="reserva-fecha"
              class="form-control"
              required
            />
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label">Hora</label>
            <select id="reserva-hora" class="form-select" required>
              <option value="">Seleccione una hora...</option>
              <option value="09:00">09:00 hrs</option>
              <option value="10:00">10:00 hrs</option>
              <option value="11:00">11:00 hrs</option>
              <option value="15:00">15:00 hrs</option>
              <option value="16:00">16:00 hrs</option>
            </select>
          </div>
        </div>
        <button tyoe="submit" class="btn btn-succes w/100">
          Confirmar Reserva
        </button>
      </form>
    </main>
